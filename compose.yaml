services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: the_x
      POSTGRES_USER: the_x
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in root .env}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - the_x_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U the_x -d the_x"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  the_x_postgres:
