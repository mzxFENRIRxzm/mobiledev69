und:#dc453e}.secondary{background:transparent;border:1px solid #484c54;color:#d8dade;margin-top:10px}.primary:disabled{opacity:.7;cursor:wait}.error{background:#e44a4414;border:1px solid #b95550;border-radius:10px;padding:12px 14px;color:#ffb7b2;font-size:14px;line-height:1.6;margin-bottom:20px}.errorlist{list-style:none;margin:6px 0;padding:0;color:#ffb7b2;font-size:13px}.note{font-size:12px;line-height:1.7;color:#969ba4;text-align:center;margin:20px 0 0}.account{border:1px solid #484c54;border-radius:10px;padding:14px;overflow-wrap:anywhere;color:#e9bd69}.scopes{padding-left:22px;color:#c1c4ca;font-size:14px;line-height:1.8}.scopes li{margin:8px 0}footer{text-align:center;color:#767b84;font-size:11px;padding:18px 20px 26px;letter-spacing:1px}@media(max-width:420px){header{padding:20px}.tagline{display:none}main{padding:24px 14px}.card{padding:24px 20px}h1{font-size:25px}}
